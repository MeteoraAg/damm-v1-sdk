name: Rust SDK CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
    branches:
      - main
      - develop
      - staging
      - feat/protocol-fee-part-of-lp-fees

env:
  SOLANA_CLI_VERSION: 2.1.0
  RUST_TOOLCHAIN_VERSION: 1.76.0

jobs:
  changed_files_rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      program: ${{steps.changed-files-specific.outputs.program}}
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            program:
              - "rust-client/**"
              - "programs/**"
              - "dynamic-amm-quote/**"
              - "common/**"
              - "Cargo.toml"
              - "Cargo.lock"

  rust-test:
    needs: changed_files_rust
    runs-on: ubuntu-latest
    if: needs.changed_files_rust.outputs.program == 'true'
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup-dep
      - uses: ./.github/actions/setup-solana
      # Install rust + toolchain
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy
          override: true
      # Cargo build cache
      - name: Cargo Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/
            target
          key: ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
            ${{ runner.os }}-cargo
      - name: Cargo fmt check
        run: cargo fmt -- --check
        shell: bash
      - name: Cargo test
        run: cargo test -- --nocapture
        shell: bash

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-dep
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -- -D warnings
        shell: bash
