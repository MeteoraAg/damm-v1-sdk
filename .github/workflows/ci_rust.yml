name: Rust SDK CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
    branches:
      - main
      - develop
      - staging
      - feat/protocol-fee-part-of-lp-fees

env:
  SOLANA_CLI_VERSION: 2.1.0
  RUST_TOOLCHAIN_VERSION: 1.76.0

jobs:
  changed_files_rust:
    runs-on: ubuntu-latest
    outputs:
      program: ${{steps.changed-files-specific.outputs.any_changed}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@a2f1692a6f703b7a14e155ae404e6bb15538b763 # v18.6
        with:
          files: |
            rust-client
            programs
            dynamic-amm-quote

  rust-test:
    needs: changed_files_rust
    runs-on: ubuntu-latest
    if: needs.changed_files_rust.outputs.program == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dep
      - uses: ./.github/actions/setup-solana
      # Install rust + toolchain
      - run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN_VERSION }} --profile minimal --component rustfmt,clippy
          rustup override set ${{ env.RUST_TOOLCHAIN_VERSION }}
        shell: bash
      # Cargo build cache
      - name: Cargo Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/
            target
          key: ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
            ${{ runner.os }}-cargo
      - name: Cargo fmt check
        run: cargo fmt -- --check
        shell: bash
      - name: Cargo test
        run: cargo test -- --nocapture
        shell: bash
